name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Verify tracked Git distribution
        run: test -z "$(git status --porcelain -- dist)"

      - name: Typecheck
        run: bun run typecheck:packages

      - name: Unit tests
        run: bun run test:unit

      - name: Local SQLite E2E tests
        run: bun run test:e2e

      - name: Worker emulator tests
        run: bun run test:workers
