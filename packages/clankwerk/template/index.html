<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const preference = localStorage.getItem("clankwerk.theme") || "auto"
        const dark =
          preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121a22" : "#ffffff"
      } catch {
        /* Storage is optional; the light theme remains usable. */
      }
    </script>
    <title>Clankwerk · Operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dashboard/main.tsx"></script>
  </body>
</html>
